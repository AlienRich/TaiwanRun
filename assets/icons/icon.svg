<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050408"/>
      <stop offset="60%" stop-color="#190e28"/>
      <stop offset="100%" stop-color="#3d154a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffd32a"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3e4d"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
  </defs>

  <!-- Background rounded cabinet badge -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#ffd32a" stroke-width="8" stroke-dasharray="24 12"/>

  <!-- Sunset synthwave disc -->
  <circle cx="256" cy="240" r="140" fill="url(#sunGrad)"/>
  <g fill="#050408">
    <rect x="116" y="246" width="280" height="6"/>
    <rect x="126" y="260" width="260" height="8"/>
    <rect x="140" y="276" width="232" height="10"/>
    <rect x="160" y="294" width="192" height="12"/>
    <rect x="188" y="314" width="136" height="14"/>
  </g>

  <!-- Perspective 2.5D road -->
  <polygon points="256,260 70,490 442,490" fill="url(#roadGrad)"/>
  <!-- Yellow center stripes -->
  <polygon points="256,270 258,270 264,340 248,340" fill="#ffd32a"/>
  <polygon points="256,365 268,440 244,440" fill="#ffd32a"/>
  <polygon points="256,460 274,490 238,490" fill="#ffd32a"/>

  <!-- Red-white curbs -->
  <polygon points="256,260 244,270 54,490 70,490" fill="#e74c3c"/>
  <polygon points="256,260 268,270 458,490 442,490" fill="#ffffff"/>

  <!-- Pixel arcade racing car -->
  <g transform="translate(166, 350)">
    <!-- Spoiler -->
    <rect x="14" y="0" width="152" height="14" fill="#0984e3" stroke="#111" stroke-width="4"/>
    <rect x="30" y="14" width="14" height="18" fill="#555"/>
    <rect x="136" y="14" width="14" height="18" fill="#555"/>
    <!-- Car body -->
    <rect x="10" y="28" width="160" height="52" rx="8" fill="#e74c3c" stroke="#111" stroke-width="4"/>
    <!-- Rear windshield & roof -->
    <polygon points="36,28 144,28 126,6 54,6" fill="#00cec9" stroke="#111" stroke-width="3"/>
    <!-- License plate -->
    <rect x="65" y="56" width="50" height="18" fill="#ffd32a" stroke="#111" stroke-width="2"/>
    <!-- Taillights -->
    <rect x="16" y="42" width="30" height="16" fill="#ff0055" stroke="#111" stroke-width="2"/>
    <rect x="134" y="42" width="30" height="16" fill="#ff0055" stroke="#111" stroke-width="2"/>
    <!-- Wheels -->
    <rect x="0" y="44" width="16" height="36" rx="4" fill="#111"/>
    <rect x="164" y="44" width="16" height="36" rx="4" fill="#111"/>
  </g>

  <!-- Big neon title text -->
  <text x="256" y="104" font-family="'Courier New', 'Noto Sans TC', monospace, sans-serif" font-weight="900" font-size="52" fill="#ffd32a" text-anchor="middle" stroke="#000" stroke-width="6" paint-order="stroke fill">台灣大賽車</text>
  <text x="256" y="148" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="28" fill="#00f0ff" text-anchor="middle" stroke="#000" stroke-width="4" paint-order="stroke fill" letter-spacing="4">TAIWAN RUN</text>
</svg>